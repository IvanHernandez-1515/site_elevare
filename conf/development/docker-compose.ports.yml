services:
  frontend:
    image: node:20-alpine
    container_name: ${CONTAINER_NAME}_frontend
    working_dir: /app
    volumes:
      - ${ROOT_PATH}${FRONTEND_LOCAL_PATH}:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT_CONTAINER}"
    ports:
      - "${FRONTEND_PORT_LOCAL}:${FRONTEND_PORT_CONTAINER}"
    environment:
      - VITE_PROXY_TARGET=http://${BACKEND_SERVICE_NAME}:${BACKEND_PORT_CONTAINER}
    depends_on:
      - ${BACKEND_SERVICE_NAME}
    networks:
      - app_net

  backend:
    image: node:20-alpine
    container_name: ${CONTAINER_NAME}_backend
    working_dir: /app
    volumes:
      - ${ROOT_PATH}${BACKEND_LOCAL_PATH}:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${BACKEND_PORT_CONTAINER}"
    ports:
      - "${BACKEND_PORT_LOCAL}:${BACKEND_PORT_CONTAINER}"
    environment:
      - FRONT_URL=http://localhost:${FRONTEND_PORT_LOCAL}
    depends_on:
      - ${DB_SERVICE_NAME}
    networks:
      - app_net

  db:
    image: mysql:8
    container_name: ${CONTAINER_NAME}_db
    restart: always
    volumes:
      - ${ROOT_PATH}${MYSQL_LOCAL_PATH}:/var/lib/mysql
      - ${ROOT_PATH}${VOLUME_CONF}:/etc/mysql/conf.d
      - ${ROOT_PATH}${VOLUME_MIGRATIONS}:/docker-entrypoint-initdb.d
      - ${ROOT_PATH}${VOLUME_BACKUPS}:/backups
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - app_net
  
  adminer:
    image: adminer
    container_name: ${CONTAINER_NAME}_adminer
    restart: 'no'
    ports:
      - ${PORT_GESTOR}:8080
    networks:
      - app_net

networks:
  app_net:
    name: ${CONTAINER_NAME}_dev_net
    driver: bridge